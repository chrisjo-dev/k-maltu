<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 하지 배경 -->
  <rect width="200" height="200" rx="32" fill="#ede6cf"/>
  <!-- 인장(도장) 붉은 사각형 -->
  <rect x="32" y="32" width="136" height="136" rx="14" fill="#b83219"/>
  <!-- 도장 안쪽 이중 테두리 -->
  <rect x="38" y="38" width="124" height="124" rx="10" fill="none" stroke="rgba(255,220,200,0.28)" stroke-width="1.5"/>
  <!-- 말 자 -->
  <text
    x="100" y="142"
    text-anchor="middle"
    font-family="'Apple SD Gothic Neo', 'Noto Serif KR', 'Malgun Gothic', serif"
    font-weight="900"
    font-size="88"
    fill="rgba(237,230,207,0.96)"
  >말</text>
</svg>
