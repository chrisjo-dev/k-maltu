<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1600px;
  height: 500px;
  background: #0b0c10;
  overflow: hidden;
  position: relative;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
}

.bg {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(0,255,163,0.055) 1px, transparent 1px);
  background-size: 28px 28px;
}
.glow {
  position: absolute;
  left: -200px; top: -200px;
  width: 700px; height: 700px;
  background: radial-gradient(ellipse, rgba(0,255,163,0.07) 0%, transparent 65%);
}
.glow-r {
  position: absolute;
  right: -100px; bottom: -100px;
  width: 500px; height: 500px;
  background: radial-gradient(ellipse, rgba(255,107,53,0.05) 0%, transparent 65%);
}

/* Big "말투" decorative text - right side */
.deco {
  position: absolute;
  right: -20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 340px;
  font-weight: 900;
  color: rgba(0,255,163,0.04);
  line-height: 1;
  letter-spacing: -0.05em;
  user-select: none;
  pointer-events: none;
}

.wrap {
  position: relative;
  z-index: 1;
  width: 1600px;
  height: 500px;
  padding: 60px 80px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.toprow {
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo-sq {
  width: 52px; height: 52px;
  background: #00ffa3;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; font-size: 24px;
  color: #0b0c10;
}
.logo-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  color: rgba(255,255,255,0.82);
}
.slash {
  color: rgba(255,255,255,0.18);
  margin: 0 4px;
}
.desc-top {
  font-size: 15px;
  color: rgba(255,255,255,0.38);
  font-weight: 400;
}

.midrow {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 820px;
}
.tagline {
  font-size: 72px;
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.1;
  color: #f0f0f2;
}
.tagline .hl { color: #00ffa3; }
.sub {
  font-size: 17px;
  color: rgba(255,255,255,0.42);
  font-weight: 400;
  line-height: 1.5;
  max-width: 600px;
}

.bottomrow {
  display: flex;
  align-items: center;
  gap: 10px;
}
.reg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 6px 18px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.42);
}
.reg.active {
  background: rgba(0,255,163,0.1);
  border-color: rgba(0,255,163,0.3);
  color: #00ffa3;
  font-weight: 700;
}
.sep { color: rgba(255,255,255,0.12); margin: 0 4px; }
.mit-badge {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.2);
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="glow"></div>
<div class="glow-r"></div>
<div class="deco">말</div>

<div class="wrap">
  <div class="toprow">
    <div class="logo-sq">k</div>
    <span class="logo-name">k-maltu</span>
    <span class="slash">|</span>
    <span class="desc-top">Claude Code Skill</span>
  </div>

  <div class="midrow">
    <div class="tagline">
      AI가 쓴 한국어,<br>
      <span class="hl">사람 말투로.</span>
    </div>
    <div class="sub">
      blog, threads, dc, gongmun 네 가지 말투로 변환하고<br>
      AI 문체를 걷어내고, 숨은 문자와 이미지 메타데이터를 정리한다.
    </div>
  </div>

  <div class="bottomrow">
    <span class="reg active">blog</span>
    <span class="reg">threads</span>
    <span class="reg">dc</span>
    <span class="reg">gongmun</span>
    <span class="mit-badge">MIT License</span>
  </div>
</div>
</body>
</html>
