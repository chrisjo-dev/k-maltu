<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1600px;
  height: 500px;
  background: #faf8f5;
  overflow: hidden;
  position: relative;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
}

/* Thin top accent bar */
.topbar-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: #c0391b;
}

/* Large decorative background text */
.deco {
  position: absolute;
  right: -30px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Noto Serif KR', serif;
  font-size: 480px;
  font-weight: 900;
  color: rgba(0,0,0,0.03);
  line-height: 1;
  letter-spacing: -0.06em;
  user-select: none;
  pointer-events: none;
}

.wrap {
  position: relative;
  z-index: 1;
  width: 1600px;
  height: 500px;
  padding: 60px 88px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* TOP: logo */
.logo-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo-sq {
  width: 48px; height: 48px;
  background: #1a1a1a;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif KR', serif;
  font-weight: 900;
  font-size: 22px;
  color: #faf8f5;
}
.logo-name {
  font-size: 21px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: -0.01em;
}
.div-sep {
  width: 1px; height: 20px;
  background: rgba(0,0,0,0.15);
  margin: 0 6px;
}
.skill-label {
  font-size: 13px;
  color: rgba(0,0,0,0.38);
  font-weight: 500;
}

/* CENTER: main */
.center {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 860px;
}
.tagline {
  font-family: 'Noto Serif KR', serif;
  font-size: 80px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.04em;
  color: #1a1a1a;
}
.tagline .accent { color: #c0391b; }

.sub {
  font-size: 18px;
  color: rgba(0,0,0,0.48);
  line-height: 1.55;
  font-weight: 400;
}

/* BOTTOM: register tags */
.bottom-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.reg {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 18px;
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 6px;
  font-size: 13px;
  color: rgba(0,0,0,0.45);
  font-weight: 500;
}
.reg .ending {
  font-family: 'Noto Serif KR', serif;
  font-weight: 900;
  font-size: 16px;
  color: #1a1a1a;
}
.reg.first {
  border-color: rgba(192,57,27,0.3);
  background: rgba(192,57,27,0.05);
}
.reg.first .ending { color: #c0391b; }

.mit {
  margin-left: auto;
  font-size: 12px;
  color: rgba(0,0,0,0.25);
  letter-spacing: 0.05em;
}
</style>
</head>
<body>
<div class="topbar-line"></div>
<div class="deco">말</div>

<div class="wrap">
  <div class="logo-row">
    <div class="logo-sq">말</div>
    <span class="logo-name">k-maltu</span>
    <div class="div-sep"></div>
    <span class="skill-label">Claude Code Skill</span>
  </div>

  <div class="center">
    <div class="tagline">
      AI가 쓴 한국어,<br>
      <span class="accent">사람 말투로.</span>
    </div>
    <div class="sub">
      네 가지 말투로 바꾸고, AI 문체를 걷어내고, 숨은 문자와 이미지 메타데이터를 지운다.
    </div>
  </div>

  <div class="bottom-row">
    <div class="reg first">
      <span class="ending">~다</span>
      <span>blog</span>
    </div>
    <div class="reg">
      <span class="ending">~요</span>
      <span>threads</span>
    </div>
    <div class="reg">
      <span class="ending">~음</span>
      <span>dc</span>
    </div>
    <div class="reg">
      <span class="ending">~함</span>
      <span>gongmun</span>
    </div>
    <span class="mit">MIT License</span>
  </div>
</div>
</body>
</html>
