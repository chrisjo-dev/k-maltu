<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1280px;
  height: 640px;
  background: #0b0c10;
  overflow: hidden;
  position: relative;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
}

/* Subtle dot grid */
.bg {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(0,255,163,0.07) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* Ambient glow */
.glow-left {
  position: absolute;
  left: -120px;
  top: 50%;
  transform: translateY(-50%);
  width: 480px;
  height: 480px;
  background: radial-gradient(ellipse, rgba(0,255,163,0.09) 0%, transparent 70%);
  pointer-events: none;
}
.glow-right {
  position: absolute;
  right: -80px;
  top: -80px;
  width: 400px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(255,107,53,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.wrap {
  position: relative;
  z-index: 1;
  width: 1280px;
  height: 640px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 48px 64px;
}

/* TOP NAV */
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo-sq {
  width: 44px; height: 44px;
  background: #00ffa3;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 20px;
  color: #0b0c10;
  letter-spacing: -0.03em;
  flex-shrink: 0;
}
.logo-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.01em;
}
.skill-pill {
  margin-left: auto;
  border: 1px solid rgba(0,255,163,0.28);
  background: rgba(0,255,163,0.06);
  padding: 5px 16px;
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #00ffa3;
  letter-spacing: 0.08em;
}

/* MAIN CONTENT */
.main {
  display: grid;
  grid-template-columns: 1fr 440px;
  gap: 48px;
  align-items: center;
}

/* LEFT: tagline + description */
.left {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.tagline {
  font-size: 56px;
  font-weight: 900;
  line-height: 1.18;
  letter-spacing: -0.03em;
  color: #f0f0f2;
}
.tagline .hl {
  color: #00ffa3;
  position: relative;
  display: inline-block;
}
.desc {
  font-size: 16px;
  line-height: 1.6;
  color: rgba(255,255,255,0.46);
  font-weight: 400;
  max-width: 440px;
}

/* RIGHT: transform card */
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 16px;
  padding: 28px 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 0;
  font-family: 'JetBrains Mono', monospace;
}
.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.dot { width: 10px; height: 10px; border-radius: 50%; }
.d-red { background: #ff5f57; }
.d-yellow { background: #febc2e; }
.d-green { background: #28c840; }
.card-title {
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.05em;
  margin-left: 4px;
}

.block-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  margin-bottom: 8px;
}
.block-label.before { color: rgba(255,107,53,0.7); }
.block-label.after { color: #00ffa3; }

.block-text {
  font-size: 13.5px;
  line-height: 1.65;
  padding: 12px 14px;
  border-radius: 8px;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  font-weight: 400;
  margin-bottom: 16px;
}
.block-text.before {
  background: rgba(255,107,53,0.06);
  color: rgba(255,255,255,0.38);
  text-decoration: none;
}
.arrow-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px 0 12px;
  padding: 0 4px;
}
.arrow-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(0,255,163,0.15), rgba(0,255,163,0.5), rgba(0,255,163,0.15));
}
.arrow-icon {
  color: #00ffa3;
  font-size: 18px;
}
.register-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #00ffa3;
  letter-spacing: 0.1em;
}
.block-text.after {
  background: rgba(0,255,163,0.06);
  color: rgba(255,255,255,0.88);
  border: 1px solid rgba(0,255,163,0.15);
}

/* BOTTOM: register tags */
.bottombar {
  display: flex;
  align-items: center;
  gap: 8px;
}
.reg-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  padding: 5px 14px;
  border-radius: 6px;
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.04em;
  border: 1px solid rgba(255,255,255,0.07);
}
.reg-tag.active {
  background: rgba(0,255,163,0.12);
  color: #00ffa3;
  border-color: rgba(0,255,163,0.25);
  font-weight: 700;
}
.mit {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.06em;
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="glow-left"></div>
<div class="glow-right"></div>
<div class="wrap">

  <div class="topbar">
    <div class="logo-sq">k</div>
    <span class="logo-name">k-maltu</span>
    <span class="skill-pill">Claude Code Skill</span>
  </div>

  <div class="main">
    <div class="left">
      <div class="tagline">
        AI가 쓴 한국어,<br>
        <span class="hl">사람 말투로.</span>
      </div>
      <div class="desc">
        blog, threads, dc, gongmun 네 가지 말투로 바꾸고<br>
        AI 문체를 걷어내고, 숨은 문자와 이미지 메타데이터를 지운다.
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="dot d-red"></div>
        <div class="dot d-yellow"></div>
        <div class="dot d-green"></div>
        <span class="card-title">k-maltu transform</span>
      </div>

      <span class="block-label before">BEFORE</span>
      <div class="block-text before">
        이러한 문제는 생각보다 많은 분들이<br>
        겪고 계신 매우 흔한 문제입니다.
      </div>

      <div class="arrow-row">
        <div class="arrow-line"></div>
        <span class="arrow-icon">↓</span>
        <span class="register-badge">BLOG</span>
        <div class="arrow-line"></div>
      </div>

      <span class="block-label after">AFTER</span>
      <div class="block-text after">
        찾아보니 나만 겪는 일은 아니었다.
      </div>
    </div>
  </div>

  <div class="bottombar">
    <span class="reg-tag active">blog</span>
    <span class="reg-tag">threads</span>
    <span class="reg-tag">dc</span>
    <span class="reg-tag">gongmun</span>
    <span class="mit">MIT License</span>
  </div>

</div>
</body>
</html>
