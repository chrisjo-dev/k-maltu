<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1280px;
  height: 640px;
  background: #faf8f5;
  overflow: hidden;
  position: relative;
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
}

/* Accent stripe left */
.stripe {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 6px;
  background: #c0391b;
}

/* Split layout */
.wrap {
  position: relative;
  z-index: 1;
  width: 1280px;
  height: 640px;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

/* LEFT: typographic specimen */
.left {
  padding: 60px 56px 60px 76px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  border-right: 1px solid rgba(0,0,0,0.08);
}

.specimen-label {
  font-size: 11px;
  letter-spacing: 0.16em;
  color: #c0391b;
  font-weight: 700;
  margin-bottom: 24px;
  font-family: 'Noto Sans KR', sans-serif;
}

.endings {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.ending-row {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.07);
}
.ending-row:first-child {
  border-top: 1px solid rgba(0,0,0,0.07);
}

.ending-form {
  font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
  font-size: 48px;
  font-weight: 900;
  color: #1a1a1a;
  letter-spacing: -0.03em;
  min-width: 160px;
  line-height: 1.1;
}
.ending-form.muted {
  color: rgba(0,0,0,0.22);
}
.ending-name {
  font-size: 13px;
  color: rgba(0,0,0,0.38);
  font-weight: 500;
  letter-spacing: 0.04em;
}

/* RIGHT: info */
.right {
  padding: 56px 64px 56px 56px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-sq {
  width: 40px; height: 40px;
  background: #1a1a1a;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif KR', serif;
  font-weight: 900;
  font-size: 20px;
  color: #faf8f5;
}
.logo-name {
  font-size: 19px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: -0.01em;
}

.mid-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
}

.tagline {
  font-family: 'Noto Serif KR', serif;
  font-size: 46px;
  font-weight: 900;
  line-height: 1.22;
  letter-spacing: -0.03em;
  color: #1a1a1a;
}
.tagline .accent { color: #c0391b; }

.desc-lines {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.desc-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  color: rgba(0,0,0,0.52);
  line-height: 1.5;
}
.bullet {
  color: #c0391b;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}

.bottom-row {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.install-box {
  background: #1a1a1a;
  border-radius: 8px;
  padding: 10px 16px;
  font-family: 'Noto Sans KR', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.02em;
}
.install-box span { color: rgba(255,255,255,0.3); margin-right: 6px; }
.install-box code { color: #c0391b; font-family: monospace; }

.meta-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.meta-chip {
  font-size: 11px;
  color: rgba(0,0,0,0.38);
  padding: 3px 10px;
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 4px;
  letter-spacing: 0.06em;
}
.meta-chip.red {
  color: #c0391b;
  border-color: rgba(192,57,27,0.25);
  background: rgba(192,57,27,0.04);
}
</style>
</head>
<body>
<div class="stripe"></div>
<div class="wrap">

  <div class="left">
    <div class="specimen-label">말투 REGISTER</div>
    <div class="endings">
      <div class="ending-row">
        <div class="ending-form">~다</div>
        <div class="ending-name">blog</div>
      </div>
      <div class="ending-row">
        <div class="ending-form muted">~요</div>
        <div class="ending-name">threads</div>
      </div>
      <div class="ending-row">
        <div class="ending-form muted">~음</div>
        <div class="ending-name">dc</div>
      </div>
      <div class="ending-row">
        <div class="ending-form muted">~함</div>
        <div class="ending-name">gongmun</div>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="logo-row">
      <div class="logo-sq">말</div>
      <span class="logo-name">k-maltu</span>
    </div>

    <div class="mid-section">
      <div class="tagline">
        AI가 쓴 한국어,<br>
        <span class="accent">사람 말투로.</span>
      </div>
      <div class="desc-lines">
        <div class="desc-line">
          <span class="bullet">1</span>
          <span>AI 문체 제거, 말투 변환 (blog, threads, dc, gongmun)</span>
        </div>
        <div class="desc-line">
          <span class="bullet">2</span>
          <span>숨은 문자(제로폭 문자) 정리</span>
        </div>
        <div class="desc-line">
          <span class="bullet">3</span>
          <span>이미지 EXIF, XMP, C2PA 메타데이터 제거</span>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="install-box">
        <span>$</span>git clone https://github.com/chrisjo-dev/<code>k-maltu</code>
      </div>
      <div class="meta-row">
        <span class="meta-chip red">Claude Code Skill</span>
        <span class="meta-chip">MIT License</span>
        <span class="meta-chip">Python 3.10+</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
